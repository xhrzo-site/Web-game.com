<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat dengan User - The All Game</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        body{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;padding:20px;}
        
        /* Header */
        .header{background:rgba(0,0,0,.4);padding:20px;border-radius:15px;margin-bottom:20px;border:1px solid #00ff88;max-width:1000px;margin-left:auto;margin-right:auto;}
        .back-btn{background:rgba(0,255,136,.15);border:2px solid #00ff88;color:#00ff88;width:50px;height:50px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;text-decoration:none;margin-bottom:10px;}
        .back-btn:hover{background:rgba(0,255,136,.3);}
        .header h1{color:#00ff88;font-size:24px;}
        .header h1 small{font-size:14px;color:#88ffcc;margin-left:10px;}

        /* Chat Container */
        .chat-container{max-width:1000px;margin:0 auto;background:rgba(20,20,30,.8);border-radius:20px;border:1px solid #00ff88;overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 150px);}

        /* Chat Header */
        .chat-header{padding:20px;background:rgba(0,0,0,.4);border-bottom:2px solid #00ff88;display:flex;align-items:center;gap:15px;}
        .user-avatar{width:50px;height:50px;border-radius:50%;background:#00ff88;display:flex;align-items:center;justify-content:center;font-size:24px;color:#1a1a2e;font-weight:bold;border:2px solid #fff;}
        .user-info h3{color:#00ff88;font-size:18px;}
        .user-status{font-size:13px;display:flex;align-items:center;gap:5px;margin-top:3px;}
        .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
        .status-dot.online{background:#00ff88;box-shadow:0 0 10px #00ff88;}
        .status-dot.offline{background:#ff3333;}

        /* Chat Messages */
        .chat-messages{flex:1;overflow-y:auto;padding:25px;background:rgba(0,0,0,.3);}
        .chat-messages::-webkit-scrollbar{width:8px;}
        .chat-messages::-webkit-scrollbar-thumb{background:#00ff88;border-radius:4px;}
        
        .message{display:flex;margin-bottom:15px;}
        .message.sent{justify-content:flex-end;}
        .message.received{justify-content:flex-start;}
        
        .message-bubble{max-width:70%;padding:12px 16px;border-radius:15px;word-wrap:break-word;font-size:15px;position:relative;}
        .sent .message-bubble{background:#00ff88;color:#1a1a2e;border-bottom-right-radius:5px;}
        .received .message-bubble{background:rgba(255,255,255,.1);color:#fff;border:1px solid #00ff88;border-bottom-left-radius:5px;}
        
        .message-time{font-size:10px;margin-top:5px;opacity:.7;text-align:right;}
        .message-status{font-size:10px;color:#88ffcc;margin-left:5px;}

        /* System Message */
        .system-message{text-align:center;margin:10px 0;}
        .system-bubble{background:rgba(255,68,68,.2);color:#ff8888;padding:6px 16px;border-radius:20px;font-size:12px;border:1px solid #ff4444;}

        /* Typing Indicator */
        .typing-indicator{display:flex;gap:5px;padding:10px 15px;background:rgba(255,255,255,.1);border-radius:25px;border-bottom-left-radius:5px;width:fit-content;margin-bottom:5px;}
        .typing-indicator span{width:8px;height:8px;background:#00ff88;border-radius:50%;animation:typing 1s infinite;}
        .typing-indicator span:nth-child(2){animation-delay:.2s;}
        .typing-indicator span:nth-child(3){animation-delay:.4s;}

        /* Chat Input */
        .chat-input-container{padding:20px;background:rgba(0,0,0,.4);border-top:2px solid #00ff88;}
        .chat-form{display:flex;gap:10px;}
        .input-wrapper{flex:1;position:relative;}
        .chat-input{width:100%;padding:15px;background:rgba(255,255,255,.1);border:2px solid #00ff88;border-radius:10px;color:#fff;font-size:16px;resize:none;min-height:80px;}
        .chat-input:focus{outline:none;background:rgba(255,255,255,.15);}
        .char-counter{position:absolute;bottom:5px;right:10px;font-size:11px;color:#888;}
        .send-btn{background:#00ff88;border:none;border-radius:10px;padding:0 30px;color:#1a1a2e;font-weight:bold;font-size:16px;cursor:pointer;transition:.3s;height:80px;}
        .send-btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px #00ff88;}
        .send-btn:disabled{opacity:.5;cursor:not-allowed;}

        /* Warning Info */
        .warning-info{max-width:1000px;margin:20px auto 0;padding:10px;background:rgba(255,68,68,.1);border:1px solid #ff4444;border-radius:8px;font-size:13px;color:#ff8888;text-align:center;}

        /* Message Popup */
        .message-popup{position:fixed;top:20px;right:20px;padding:15px 25px;border-radius:8px;color:#fff;font-weight:bold;z-index:1000;animation:slideIn .3s;}
        .message-popup.success{background:#00ff88;color:#1a1a2e;}
        .message-popup.error{background:#ff4444;}

        /* Animations */
        @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
        @keyframes typing{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(-5px);opacity:1;}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

        /* States */
        .loading{text-align:center;padding:40px;color:#00ff88;}
        .empty-chat{text-align:center;padding:40px;color:#88ffcc;}

        /* Responsive */
        @media(max-width:768px){
            body{padding:10px;}
            .chat-container{height:calc(100vh - 200px);}
            .message-bubble{max-width:85%;font-size:14px;}
            .send-btn{padding:0 20px;}
            .header h1{font-size:20px;}
            .header h1 small{display:block;margin-left:0;margin-top:5px;}
        }
        @media(max-width:480px){
            .back-btn{width:40px;height:40px;font-size:20px;}
            .chat-input{padding:12px;min-height:70px;}
            .send-btn{height:70px;padding:0 15px;}
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="javascript:void(0)" onclick="goBack()" class="back-btn">←</a>
        <h1>CHAT PRIVATE <small id="userStatusHeader"></small></h1>
    </div>
    
    <div class="chat-container">
        <div class="chat-header">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-info">
                <h3 id="chatUsername">Loading...</h3>
                <div class="user-status" id="userStatus">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Memuat...</span>
                </div>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="loading">Memuat percakapan...</div>
        </div>

        <!-- Typing Indicator -->
        <div id="typingIndicator" style="display:none;padding:0 20px 10px 20px;">
            <div class="typing-indicator"><span></span><span></span><span></span></div>
        </div>
        
        <div class="chat-input-container">
            <form class="chat-form" id="chatForm" onsubmit="sendMessage(event)">
                <div class="input-wrapper">
                    <textarea 
                        class="chat-input" 
                        id="messageInput" 
                        placeholder="Ketik pesan..." 
                        maxlength="500"
                        oninput="updateCharCounter()"
                        onkeydown="handleKeyPress(event)"
                    ></textarea>
                    <div class="char-counter" id="charCounter">0/500</div>
                </div>
                <button type="submit" class="send-btn" id="sendBtn">Kirim</button>
            </form>
        </div>
    </div>
    
    <div class="warning-info" id="warningInfo">
        ⚠️ Dilarang menggunakan kata kasar
    </div>
    
    <audio id="clickSound" preload="auto" src="https://c.top4top.io/m_3673bf8xd0.mp3"></audio>

    <script>
        // Variabel global
        let currentUser = null, chatUser = null, chatId = null, chatListener = null, typingTimeout = null, isTyping = false;
        let clickVolume = 0.7;
        const MAX_MESSAGE_LENGTH = 500;
        
        // Filter kata kasar (sama dengan contact.html)
        const blockedWords = ['kontol', 'memek', 'tuti', 'adam', 'dam', 'haer', 'tut', 'nisa'];

        // Utility Functions
        function playClickSound() {
            try {
                const sound = document.getElementById('clickSound');
                if(sound) {
                    sound.volume = clickVolume;
                    sound.currentTime = 0;
                    sound.play().catch(()=>{});
                }
            } catch(e){}
        }

        // Load volume dari localStorage
        const savedClickVol = localStorage.getItem('clickVolume');
        if(savedClickVol) clickVolume = parseFloat(savedClickVol);

        function showMessage(text, type) {
            const msg = document.createElement('div');
            msg.className = `message-popup ${type}`;
            msg.textContent = text;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 3000);
        }

        function goBack() { 
            playClickSound(); 
            window.location.href = 'lobby.html'; 
        }

        function updateCharCounter() {
            const input = document.getElementById('messageInput');
            const counter = document.getElementById('charCounter');
            counter.textContent = `${input.value.length}/${MAX_MESSAGE_LENGTH}`;
        }

        function formatTime(timestamp) {
            if(!timestamp) return '';
            const d = new Date(timestamp);
            return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(t) { 
            const d = document.createElement('div'); 
            d.textContent = t; 
            return d.innerHTML; 
        }

        function scrollToBottom() { 
            setTimeout(() => {
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
            }, 100); 
        }

        // Filter kata kasar (sama dengan contact.html)
        function containsBlockedWords(text) {
            const lowerText = text.toLowerCase();
            for(let word of blockedWords) {
                if(lowerText.includes(word)) return word;
            }
            return false;
        }

        // Encrypt/Decrypt (sama dengan contact.html)
        function encryptMessage(text) {
            let encrypted = '';
            for(let i = 0; i < text.length; i++) {
                encrypted += String.fromCharCode(text.charCodeAt(i) + 5);
            }
            return encrypted.split('').reverse().join('');
        }

        function decryptMessage(encryptedText) {
            try {
                const reversed = encryptedText.split('').reverse().join('');
                let decrypted = '';
                for(let i = 0; i < reversed.length; i++) {
                    decrypted += String.fromCharCode(reversed.charCodeAt(i) - 5);
                }
                return decrypted;
            } catch(e) {
                return "[Error]";
            }
        }

        // Chat Functions
        async function initChat() {
            try {
                if(typeof database === 'undefined') return showMessage('Database error!','error');
                
                const saved = localStorage.getItem('currentUser');
                if(!saved) return window.location.href = 'login.html';
                currentUser = JSON.parse(saved);
                if(!currentUser?.uid) return window.location.href = 'login.html';

                const chatData = localStorage.getItem('chatUser');
                if(!chatData) { 
                    showMessage('Tidak ada user dipilih','error'); 
                    setTimeout(()=>window.location.href='lobby.html',1500); 
                    return; 
                }
                
                chatUser = JSON.parse(chatData);
                if(!chatUser?.uid) { 
                    showMessage('Data user tidak valid','error'); 
                    setTimeout(()=>window.location.href='lobby.html',1500); 
                    return; 
                }

                // Update tampilan
                document.getElementById('chatUsername').textContent = chatUser.username || 'Unknown';
                document.getElementById('userAvatar').textContent = (chatUser.username || 'U').charAt(0).toUpperCase();
                document.getElementById('userStatusHeader').textContent = `@${chatUser.username || 'user'}`;
                
                chatId = [currentUser.uid, chatUser.uid].sort().join('_');
                
                loadMessages();
                monitorUserStatus();
                setupTypingIndicator();
                markMessagesAsRead();
                updateCharCounter();

                // Event listener untuk klik
                document.querySelectorAll('button, .back-btn').forEach(btn => {
                    btn.addEventListener('click', playClickSound);
                });

            } catch(e) { 
                console.error(e); 
                showMessage('Error: '+e.message,'error'); 
            }
        }

        function loadMessages() {
            if(!chatId||!database) return;
            if(chatListener) database.ref('chats/'+chatId).off('value', chatListener);
            
            const container = document.getElementById('chatMessages');
            container.innerHTML = '<div class="loading">Memuat pesan...</div>';

            chatListener = database.ref('chats/'+chatId).orderByChild('timestamp').limitToLast(50).on('value', (snap) => {
                try {
                    const msgs = snap.exists() ? snap.val() : {};
                    let html = '';
                    
                    // Konversi ke array dan sort
                    const arr = [];
                    snap.forEach(child => {
                        arr.push({id: child.key, ...child.val()});
                    });
                    arr.sort((a,b) => (a.timestamp||0) - (b.timestamp||0));
                    
                    if(arr.length === 0) {
                        html = '<div class="empty-chat">Belum ada pesan. Kirim pesan pertama!</div>';
                    } else {
                        arr.forEach(m => {
                            const sent = m.sender === currentUser.uid;
                            const decrypted = decryptMessage(m.text || '');
                            
                            html += `
                                <div class="message ${sent ? 'sent' : 'received'}">
                                    <div class="message-bubble">
                                        ${escapeHtml(decrypted)}
                                        <div class="message-time">
                                            ${formatTime(m.timestamp)}
                                            ${sent ? '<span class="message-status">✓</span>' : ''}
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                    }
                    
                    container.innerHTML = html;
                    scrollToBottom();
                    markMessagesAsRead();
                } catch(e) { 
                    console.error(e); 
                    container.innerHTML = '<div class="empty-chat">Error memuat pesan</div>'; 
                }
            });
        }

        async function sendMessage(event) {
            event.preventDefault();
            playClickSound();

            const input = document.getElementById('messageInput');
            let message = input.value.trim();

            if(!message) return showMessage('Pesan tidak boleh kosong','error');
            if(message.length > MAX_MESSAGE_LENGTH) return showMessage('Pesan terlalu panjang','error');
            if(!currentUser||!chatUser||!chatId||!database) return showMessage('Error: Data tidak lengkap','error');

            // Cek kata kasar
            const blockedWord = containsBlockedWords(message);
            if(blockedWord) {
                showMessage('Kata tidak diperbolehkan','error');
                
                const container = document.getElementById('chatMessages');
                const systemMsg = document.createElement('div');
                systemMsg.className = 'system-message';
                systemMsg.innerHTML = `<div class="system-bubble">⚠️ Pesan diblokir (kata kasar)</div>`;
                container.appendChild(systemMsg);
                container.scrollTop = container.scrollHeight;
                
                input.value = '';
                updateCharCounter();
                return;
            }

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                // Stop typing indicator
                stopTyping();

                // Encrypt message
                const encrypted = encryptMessage(message);

                // Simpan pesan
                const messageData = {
                    sender: currentUser.uid,
                    receiver: chatUser.uid,
                    text: encrypted,
                    encrypted: true,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    read: false
                };

                await database.ref('chats/' + chatId).push(messageData);

                // Update recent chat
                const recent = { 
                    with: chatUser.uid, 
                    username: chatUser.username, 
                    lastMessage: message.substring(0,30) + (message.length>30?'...':''), 
                    lastTime: firebase.database.ServerValue.TIMESTAMP, 
                    unread: false 
                };
                const recentOther = { 
                    with: currentUser.uid, 
                    username: currentUser.username, 
                    lastMessage: message.substring(0,30) + (message.length>30?'...':''), 
                    lastTime: firebase.database.ServerValue.TIMESTAMP, 
                    unread: true 
                };

                await database.ref('recent_chats/'+currentUser.uid+'/'+chatUser.uid).set(recent);
                await database.ref('recent_chats/'+chatUser.uid+'/'+currentUser.uid).set(recentOther);

                input.value = '';
                updateCharCounter();
                scrollToBottom();

            } catch(e) { 
                console.error(e); 
                showMessage('Gagal mengirim pesan','error'); 
            } finally {
                sendBtn.disabled = false;
            }
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                sendMessage(e); 
            }
            if(!isTyping) startTyping();
            if(typingTimeout) clearTimeout(typingTimeout);
            typingTimeout = setTimeout(stopTyping, 2000);
        }

        function startTyping() {
            if(!currentUser||!chatUser||!database||!chatId) return;
            isTyping = true;
            database.ref('typing/'+chatId+'/'+currentUser.uid).set({ 
                typing: true, 
                timestamp: firebase.database.ServerValue.TIMESTAMP 
            });
        }

        function stopTyping() {
            if(!currentUser||!chatUser||!database||!chatId) return;
            isTyping = false;
            database.ref('typing/'+chatId+'/'+currentUser.uid).remove();
            if(typingTimeout) { 
                clearTimeout(typingTimeout); 
                typingTimeout = null; 
            }
        }

        function setupTypingIndicator() {
            if(!database||!chatId) return;
            database.ref('typing/'+chatId).on('value', (snap) => {
                try {
                    const data = snap.exists() ? snap.val() : {};
                    const otherTyping = Object.keys(data).some(uid => 
                        uid !== currentUser.uid && data[uid]?.typing === true
                    );
                    document.getElementById('typingIndicator').style.display = otherTyping ? 'block' : 'none';
                } catch(e){}
            });
        }

        function monitorUserStatus() {
            if(!database||!chatUser) return;
            database.ref('users/'+chatUser.uid).on('value', (snap) => {
                try {
                    const user = snap.val();
                    if(user) {
                        const online = user.status === 'online';
                        document.getElementById('statusDot').className = `status-dot ${online ? 'online' : 'offline'}`;
                        document.getElementById('statusText').textContent = online ? 'Online' : 'Offline';
                        
                        if(user.username && user.username !== chatUser.username) {
                            chatUser.username = user.username;
                            document.getElementById('chatUsername').textContent = user.username;
                            document.getElementById('userAvatar').textContent = user.username.charAt(0).toUpperCase();
                        }
                    }
                } catch(e){}
            });
        }

        function markMessagesAsRead() {
            if(!database||!chatId||!currentUser) return;
            
            database.ref('chats/'+chatId).orderByChild('read').equalTo(false).once('value', (snap) => {
                if(!snap.exists()) return;
                const updates = {};
                snap.forEach(child => { 
                    if(child.val().receiver === currentUser.uid) {
                        updates[child.key + '/read'] = true; 
                    }
                });
                if(Object.keys(updates).length > 0) {
                    database.ref('chats/'+chatId).update(updates);
                }
            });
            
            database.ref('recent_chats/'+currentUser.uid+'/'+chatUser.uid+'/unread').set(false);
        }

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if(chatListener) database.ref('chats/'+chatId).off('value', chatListener);
            if(database && chatId) database.ref('typing/'+chatId+'/'+currentUser?.uid).remove();
        });

        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape') goBack();
        });

        document.addEventListener('DOMContentLoaded', initChat);
    </script>
</body>
</html>
