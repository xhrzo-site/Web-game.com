<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat User - The All Game</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        body{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;display:flex;flex-direction:column;}
        
        /* Header */
        .chat-header{background:rgba(0,0,0,.4);backdrop-filter:blur(10px);border-bottom:2px solid #00ff88;padding:15px 20px;display:flex;align-items:center;gap:15px;position:sticky;top:0;z-index:100;}
        .back-btn{background:rgba(0,255,136,.15);border:1.5px solid #00ff88;border-radius:30px;padding:10px 18px;color:#00ff88;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s;text-decoration:none;}
        .back-btn:hover{background:rgba(0,255,136,.3);transform:scale(1.05);}
        .user-info{flex:1;display:flex;align-items:center;gap:15px;}
        .user-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00cc6a);display:flex;align-items:center;justify-content:center;font-size:24px;color:#1a1a2e;font-weight:bold;border:2px solid #fff;}
        .user-details{display:flex;flex-direction:column;}
        .chat-username{font-size:20px;font-weight:bold;color:#00ff88;}
        .user-status{font-size:14px;display:flex;align-items:center;gap:5px;}
        .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
        .status-dot.online{background:#00ff88;box-shadow:0 0 10px #00ff88;}
        .status-dot.offline{background:#ff3333;}

        /* Chat Container */
        .chat-container{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;max-height:calc(100vh - 140px);}
        .chat-container::-webkit-scrollbar{width:6px;}
        .chat-container::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:10px;}
        .chat-container::-webkit-scrollbar-thumb{background:rgba(0,255,136,.3);border-radius:10px;}

        /* Message Bubbles */
        .message{max-width:70%;display:flex;flex-direction:column;gap:5px;animation:fadeIn .3s;}
        .message.sent{align-self:flex-end;}
        .message.received{align-self:flex-start;}
        .bubble{padding:12px 18px;border-radius:25px;font-size:15px;line-height:1.5;word-wrap:break-word;}
        .message.sent .bubble{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#1a1a2e;border-bottom-right-radius:5px;}
        .message.received .bubble{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(0,255,136,.3);border-bottom-left-radius:5px;}
        .message-time{font-size:11px;color:#88ffcc;opacity:.8;margin:0 10px;}
        .message.sent .message-time{text-align:right;}

        /* Input Area */
        .chat-input-area{background:rgba(0,0,0,.4);backdrop-filter:blur(10px);border-top:2px solid #00ff88;padding:15px 20px;display:flex;gap:15px;position:sticky;bottom:0;z-index:100;}
        .chat-input{flex:1;background:rgba(255,255,255,.1);border:2px solid rgba(0,255,136,.3);border-radius:40px;padding:15px 20px;color:#fff;font-size:16px;outline:none;transition:.2s;}
        .chat-input:focus{border-color:#00ff88;background:rgba(255,255,255,.15);}
        .chat-input::placeholder{color:rgba(255,255,255,.5);}
        .send-btn{background:linear-gradient(135deg,#00ff88,#00cc6a);border:none;border-radius:40px;padding:0 30px;color:#1a1a2e;font-weight:bold;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s;}
        .send-btn:hover{transform:scale(1.05);box-shadow:0 0 15px rgba(0,255,136,.5);}
        .send-btn:active{transform:scale(.95);}

        /* Typing Indicator */
        .typing-indicator{display:flex;gap:5px;padding:10px 15px;background:rgba(255,255,255,.1);border-radius:25px;border-bottom-left-radius:5px;width:fit-content;margin-bottom:5px;}
        .typing-indicator span{width:8px;height:8px;background:#00ff88;border-radius:50%;animation:typing 1s infinite;}
        .typing-indicator span:nth-child(2){animation-delay:.2s;}
        .typing-indicator span:nth-child(3){animation-delay:.4s;}

        /* States */
        .loading{text-align:center;padding:50px;color:#00ff88;font-size:18px;}
        .empty-chat{text-align:center;padding:50px;color:#88ffcc;font-size:16px;opacity:.8;}
        .message-status{font-size:10px;color:#88ffcc;margin-left:5px;}

        /* Animations */
        @keyframes typing{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(-5px);opacity:1;}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

        /* Responsive */
        @media(max-width:768px){
            .message{max-width:85%;}
            .bubble{padding:10px 15px;font-size:14px;}
            .chat-input{padding:12px 18px;}
            .send-btn{padding:0 20px;}
            .chat-username{font-size:18px;}
            .user-avatar{width:40px;height:40px;font-size:20px;}
        }
        @media(max-width:480px){
            .back-btn span:last-child{display:none;}
            .back-btn{padding:10px;}
            .chat-input-area{padding:10px;gap:10px;}
            .send-btn{padding:0 15px;}
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="chat-header">
        <a href="javascript:void(0)" onclick="goBack()" class="back-btn">
            <span>←</span> <span>Kembali</span>
        </a>
        <div class="user-info" id="userInfo">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-details">
                <div class="chat-username" id="chatUsername">Loading...</div>
                <div class="user-status" id="userStatus">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Memuat...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-container" id="chatContainer">
        <div class="loading">Memuat percakapan...</div>
    </div>

    <!-- Typing Indicator -->
    <div id="typingIndicator" style="display:none;padding:0 20px 10px 20px;">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
    </div>

    <!-- Input -->
    <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()"><span>📤</span> Kirim</button>
    </div>

    <script>
        // Variabel global
        let currentUser = null, chatUser = null, chatId = null, chatListener = null, typingTimeout = null, isTyping = false;

        // Utility
        function playClickSound() {
            try {
                const vol = localStorage.getItem('clickVolume') ? parseFloat(localStorage.getItem('clickVolume')) : 0.7;
                new Audio('https://c.top4top.io/m_3673bf8xd0.mp3').play().catch(()=>{});
            } catch(e){}
        }

        function showMessage(txt, type) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = txt;
            msg.style.cssText = 'position:fixed;top:20px;right:20px;padding:15px 25px;border-radius:50px;z-index:2000;animation:slideIn .3s;background:' + (type==='success'?'linear-gradient(135deg,#00ff88,#00cc6a)':'linear-gradient(135deg,#ff3333,#cc0000)');
            document.body.appendChild(msg);
            setTimeout(()=>msg.remove(),3000);
        }

        function goBack() { playClickSound(); window.location.href = 'lobby.html'; }
        
        function formatTime(ts) {
            if(!ts) return '';
            const d = new Date(ts), n = new Date();
            return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
        }

        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function scrollToBottom() { setTimeout(()=>{document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;},100); }

        // Chat Functions
        async function initChat() {
            try {
                if(typeof database === 'undefined') return showMessage('Database error!','error');
                const saved = localStorage.getItem('currentUser');
                if(!saved) return window.location.href = 'login.html';
                currentUser = JSON.parse(saved);
                if(!currentUser?.uid) return window.location.href = 'login.html';

                const chatData = localStorage.getItem('chatUser');
                if(!chatData) { showMessage('Tidak ada user dipilih','error'); setTimeout(()=>window.location.href='lobby.html',1500); return; }
                chatUser = JSON.parse(chatData);
                if(!chatUser?.uid) { showMessage('Data user tidak valid','error'); setTimeout(()=>window.location.href='lobby.html',1500); return; }

                document.getElementById('chatUsername').textContent = chatUser.username || 'Unknown';
                document.getElementById('userAvatar').textContent = (chatUser.username || 'U').charAt(0).toUpperCase();
                chatId = [currentUser.uid, chatUser.uid].sort().join('_');
                
                loadMessages();
                monitorUserStatus();
                setupTypingIndicator();
                markMessagesAsRead();
            } catch(e) { console.error(e); showMessage('Error: '+e.message,'error'); }
        }

        function loadMessages() {
            if(!chatId||!database) return;
            if(chatListener) database.ref('chats/'+chatId).off('value', chatListener);
            
            const container = document.getElementById('chatContainer');
            container.innerHTML = '<div class="loading">Memuat pesan...</div>';

            chatListener = database.ref('chats/'+chatId).orderByChild('timestamp').on('value', (snap) => {
                try {
                    const msgs = snap.exists() ? snap.val() : {};
                    let html = '';
                    const arr = Object.keys(msgs).map(k=>({id:k,...msgs[k]})).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
                    
                    if(arr.length===0) html = '<div class="empty-chat">Belum ada pesan. Kirim pesan pertama!</div>';
                    else arr.forEach(m => {
                        const sent = m.sender === currentUser.uid;
                        html += `<div class="message ${sent?'sent':'received'}"><div class="bubble">${escapeHtml(m.text||'')}</div><div class="message-time">${formatTime(m.timestamp)}${sent?'<span class="message-status">✓</span>':''}</div></div>`;
                    });
                    
                    container.innerHTML = html;
                    scrollToBottom();
                    markMessagesAsRead();
                } catch(e) { console.error(e); container.innerHTML = '<div class="empty-chat">Error memuat pesan</div>'; }
            });
        }

        async function sendMessage() {
            playClickSound();
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg) return showMessage('Pesan tidak boleh kosong','error');
            if(!currentUser||!chatUser||!chatId||!database) return showMessage('Error: Data tidak lengkap','error');

            try {
                stopTyping();
                const data = { sender: currentUser.uid, receiver: chatUser.uid, text: msg, timestamp: firebase.database.ServerValue.TIMESTAMP, read: false };
                await database.ref('chats/'+chatId).push(data);
                
                const recent = { with: chatUser.uid, username: chatUser.username, lastMessage: msg, lastTime: firebase.database.ServerValue.TIMESTAMP, unread: false };
                const recentOther = { with: currentUser.uid, username: currentUser.username, lastMessage: msg, lastTime: firebase.database.ServerValue.TIMESTAMP, unread: true };
                
                await database.ref('recent_chats/'+currentUser.uid+'/'+chatUser.uid).set(recent);
                await database.ref('recent_chats/'+chatUser.uid+'/'+currentUser.uid).set(recentOther);
                
                input.value = '';
                scrollToBottom();
            } catch(e) { console.error(e); showMessage('Gagal mengirim pesan','error'); }
        }

        function handleKeyPress(e) {
            if(e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendMessage(); }
            if(!isTyping) startTyping();
            if(typingTimeout) clearTimeout(typingTimeout);
            typingTimeout = setTimeout(stopTyping, 2000);
        }

        function startTyping() {
            if(!currentUser||!chatUser||!database||!chatId) return;
            isTyping = true;
            database.ref('typing/'+chatId+'/'+currentUser.uid).set({ typing: true, timestamp: firebase.database.ServerValue.TIMESTAMP });
        }

        function stopTyping() {
            if(!currentUser||!chatUser||!database||!chatId) return;
            isTyping = false;
            database.ref('typing/'+chatId+'/'+currentUser.uid).remove();
            if(typingTimeout) { clearTimeout(typingTimeout); typingTimeout=null; }
        }

        function setupTypingIndicator() {
            if(!database||!chatId) return;
            database.ref('typing/'+chatId).on('value', (snap) => {
                try {
                    const data = snap.exists() ? snap.val() : {};
                    const otherTyping = Object.keys(data).some(uid => uid!==currentUser.uid && data[uid]?.typing===true);
                    document.getElementById('typingIndicator').style.display = otherTyping ? 'block' : 'none';
                } catch(e){}
            });
        }

        function monitorUserStatus() {
            if(!database||!chatUser) return;
            database.ref('users/'+chatUser.uid).on('value', (snap) => {
                try {
                    const user = snap.val();
                    if(user) {
                        const online = user.status === 'online';
                        document.getElementById('statusDot').className = `status-dot ${online?'online':'offline'}`;
                        document.getElementById('statusText').textContent = online ? 'Online' : 'Offline';
                        if(user.username && user.username!==chatUser.username) {
                            chatUser.username = user.username;
                            document.getElementById('chatUsername').textContent = user.username;
                        }
                    }
                } catch(e){}
            });
        }

        function markMessagesAsRead() {
            if(!database||!chatId||!currentUser) return;
            database.ref('chats/'+chatId).orderByChild('read').equalTo(false).once('value', (snap) => {
                if(!snap.exists()) return;
                const updates = {};
                snap.forEach(child => { if(child.val().receiver===currentUser.uid) updates[child.key+'/read'] = true; });
                if(Object.keys(updates).length>0) database.ref('chats/'+chatId).update(updates);
            });
            database.ref('recent_chats/'+currentUser.uid+'/'+chatUser.uid+'/unread').set(false);
        }

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if(chatListener) database.ref('chats/'+chatId).off('value', chatListener);
            if(database&&chatId) database.ref('typing/'+chatId+'/'+currentUser?.uid).remove();
        });

        document.addEventListener('DOMContentLoaded', initChat);
    </script>
</body>
</html>
