<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Game</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #1a1a2e;
            color: #fff;
            padding: 20px;
        }
        
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* Login Box */
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #16213e;
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }
        
        .login-box h2 {
            color: #00ff88;
            margin-bottom: 20px;
        }
        
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1a1a2e;
            border: 1px solid #00ff88;
            border-radius: 8px;
            color: white;
        }
        
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #00ff88;
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .login-box button:hover {
            background: #00cc6a;
        }
        
        .error {
            color: #ff4444;
            margin-top: 10px;
        }
        
        /* Header Admin */
        .admin-header {
            background: #16213e;
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .admin-header h1 {
            color: #00ff88;
        }
        
        .admin-header button {
            padding: 10px 20px;
            background: #ff4444;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        .admin-header button:hover {
            background: #cc0000;
        }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #16213e;
            border: 1px solid #00ff88;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-card h3 {
            color: #88ffcc;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            color: #00ff88;
            font-size: 28px;
            font-weight: bold;
        }
        
        /* Filter */
        .filter-section {
            background: #16213e;
            border: 1px solid #00ff88;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .filter-section input, .filter-section select {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            background: #1a1a2e;
            border: 1px solid #00ff88;
            border-radius: 5px;
            color: white;
        }
        
        /* Table */
        .users-table {
            background: #16213e;
            border: 1px solid #00ff88;
            border-radius: 10px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #1a1a2e;
            color: #00ff88;
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #00ff88;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        }
        
        tr:hover {
            background: rgba(0, 255, 136, 0.1);
        }
        
        .status-online {
            color: #00ff88;
            font-weight: bold;
        }
        
        .status-offline {
            color: #ff4444;
        }
        
        .status-banned {
            color: #ff4444;
            font-weight: bold;
        }
        
        .device-info {
            font-size: 11px;
            color: #88ffcc;
            max-width: 200px;
        }
        
        /* Action Buttons */
        .action-btn {
            padding: 6px 12px;
            margin: 2px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        
        .btn-edit { background: #ffd700; color: #1a1a2e; }
        .btn-ban { background: #ff4444; color: white; }
        .btn-unban { background: #00ff88; color: #1a1a2e; }
        .btn-delete { background: #8b0000; color: white; }
        
        .rank-select {
            background: #1a1a2e;
            color: white;
            border: 1px solid #00ff88;
            padding: 4px;
            border-radius: 4px;
        }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: #16213e;
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }
        
        .modal-content h3 {
            color: #00ff88;
            margin-bottom: 20px;
        }
        
        .modal-content input, .modal-content textarea, .modal-content select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #1a1a2e;
            border: 1px solid #00ff88;
            border-radius: 5px;
            color: white;
        }
        
        .modal-content textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .btn-save { background: #00ff88; color: #1a1a2e; }
        .btn-cancel { background: #ff4444; color: white; }
        
        /* Message */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }
        
        .message.success { background: #00ff88; color: #1a1a2e; }
        .message.error { background: #ff4444; }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #00ff88;
        }
        
        /* Rank colors */
        .rank-newbie{color:#cd7f32}.rank-junior{color:#c0c0c0}.rank-senior{color:#ffd700}
        .rank-great{color:#32cd32}.rank-super-great{color:#00ff00}.rank-legend{color:#ff4500}
        .rank-kings{color:#9370db}.rank-greatest{color:#ff00ff}.rank-mad-kings{color:#8b0000}
        .rank-greatness{color:#00ffff}.rank-unbeatable{color:#ff8c00}.rank-monster-kings{color:#800080}
        .rank-impossible{background:linear-gradient(135deg,#f00,#ff8c00,#ff0,#0f0,#0ff,#00f,#800080);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Login Form -->
        <div id="loginForm" class="login-box">
            <h2>🔐 ADMIN PANEL</h2>
            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="adminLogin()">LOGIN</button>
            <div id="loginError" class="error"></div>
        </div>
        
        <!-- Admin Panel (Hidden by default) -->
        <div id="adminPanel" style="display:none;">
            <div class="admin-header">
                <h1>👑 ADMIN PANEL</h1>
                <button onclick="adminLogout()">LOGOUT</button>
            </div>
            
            <!-- Stats -->
            <div class="stats-grid" id="statsContainer">
                <div class="stat-card"><h3>Total Users</h3><div class="value" id="totalUsers">0</div></div>
                <div class="stat-card"><h3>Online</h3><div class="value" id="onlineUsers">0</div></div>
                <div class="stat-card"><h3>Banned</h3><div class="value" id="bannedUsers">0</div></div>
                <div class="stat-card"><h3>Today Active</h3><div class="value" id="todayActive">0</div></div>
            </div>
            
            <!-- Filter -->
            <div class="filter-section">
                <input type="text" id="searchInput" placeholder="🔍 Cari username..." oninput="filterUsers()">
                <select id="statusFilter" onchange="filterUsers()">
                    <option value="all">Semua Status</option>
                    <option value="online">Online</option>
                    <option value="offline">Offline</option>
                    <option value="banned">Banned</option>
                </select>
                <select id="rankFilter" onchange="filterUsers()">
                    <option value="all">Semua Rank</option>
                    <option value="0">🥉 Newbie</option>
                    <option value="1">🥈 Junior</option>
                    <option value="2">🥇 Senior</option>
                    <option value="3">🏅 Great</option>
                    <option value="4">🎖️ Super Great</option>
                    <option value="5">🏆 Legend</option>
                    <option value="6">👑 Kings</option>
                    <option value="7">☢️ Greatest</option>
                    <option value="8">☣️ Mad Kings</option>
                    <option value="9">🔱 Greatness</option>
                    <option value="10">⚜️ Unbeatable</option>
                    <option value="11">🏴‍☠️ Monster Kings</option>
                    <option value="12">⚛️亗 Impossible</option>
                </select>
                <button onclick="refreshData()" style="background:#00ff88; color:#1a1a2e; padding:10px 20px; border:none; border-radius:5px; cursor:pointer;">🔄 Refresh</button>
            </div>
            
            <!-- Users Table -->
            <div class="users-table">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>Username</th>
                            <th>Rank</th>
                            <th>💰 Money</th>
                            <th>💎 Diamond</th>
                            <th>⭐ Stars</th>
                            <th>Device</th>
                            <th>Last Seen</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="9" class="loading">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>✏️ EDIT USER</h3>
            <input type="hidden" id="editUid">
            <input type="text" id="editUsername" placeholder="Username">
            <select id="editRank">
                <option value="0">🥉 Newbie</option>
                <option value="1">🥈 Junior</option>
                <option value="2">🥇 Senior</option>
                <option value="3">🏅 Great</option>
                <option value="4">🎖️ Super Great</option>
                <option value="5">🏆 Legend</option>
                <option value="6">👑 Kings</option>
                <option value="7">☢️ Greatest</option>
                <option value="8">☣️ Mad Kings</option>
                <option value="9">🔱 Greatness</option>
                <option value="10">⚜️ Unbeatable</option>
                <option value="11">🏴‍☠️ Monster Kings</option>
                <option value="12">⚛️亗 Impossible</option>
            </select>
            <input type="number" id="editMoney" placeholder="Money">
            <input type="number" id="editDiamond" placeholder="Diamond">
            <input type="number" id="editStars" placeholder="Stars">
            <div class="modal-buttons">
                <button class="btn-save" onclick="saveUserEdit()">SIMPAN</button>
                <button class="btn-cancel" onclick="closeEditModal()">BATAL</button>
            </div>
        </div>
    </div>
    
    <!-- Ban Modal -->
    <div id="banModal" class="modal">
        <div class="modal-content">
            <h3>🚫 BAN USER</h3>
            <input type="hidden" id="banUid">
            <input type="text" id="banUsername" readonly style="background:#333;">
            <textarea id="banReason" placeholder="Alasan ban (opsional)"></textarea>
            <div class="modal-buttons">
                <button class="btn-save" onclick="confirmBan()">BAN</button>
                <button class="btn-cancel" onclick="closeBanModal()">BATAL</button>
            </div>
        </div>
    </div>
    
    <script>
        const ADMIN_USERS = {
            'Taher': 'admin',
            'Xhrzo': 'admin'
        };
        
        let currentAdmin = null;
        let allUsers = [];
        let filteredUsers = [];
        
        const ranks = [
            '🥉 Newbie', '🥈 Junior', '🥇 Senior', '🏅 Great', '🎖️ Super Great',
            '🏆 Legend', '👑 Kings', '☢️ Greatest', '☣️ Mad Kings', '🔱 Greatness',
            '⚜️ Unbeatable', '🏴‍☠️ Monster Kings', '⚛️亗 Impossible'
        ];
        
        function showMessage(text, type) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 3000);
        }
        
        // ==================== LOGIN ====================
        function adminLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            if(ADMIN_USERS[username] && ADMIN_USERS[username] === password) {
                currentAdmin = username;
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadUsers();
                startRealtimeUpdates();
            } else {
                document.getElementById('loginError').textContent = 'Username atau password salah!';
            }
        }
        
        function adminLogout() {
            currentAdmin = null;
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
        }
        
        // ==================== LOAD USERS ====================
        function loadUsers() {
            database.ref('users').once('value', (snapshot) => {
                const users = snapshot.val();
                allUsers = [];
                
                Object.keys(users).forEach(uid => {
                    const user = users[uid];
                    allUsers.push({
                        uid: uid,
                        ...user
                    });
                });
                
                updateStats();
                filterUsers();
            });
        }
        
        function startRealtimeUpdates() {
            database.ref('users').on('value', (snapshot) => {
                const users = snapshot.val();
                allUsers = [];
                
                Object.keys(users).forEach(uid => {
                    const user = users[uid];
                    allUsers.push({
                        uid: uid,
                        ...user
                    });
                });
                
                updateStats();
                filterUsers();
            });
        }
        
        function updateStats() {
            const total = allUsers.length;
            const online = allUsers.filter(u => u.status === 'online').length;
            const banned = allUsers.filter(u => u.banned).length;
            
            const today = new Date().toDateString();
            const todayActive = allUsers.filter(u => {
                if(u.lastSeen) {
                    return new Date(u.lastSeen).toDateString() === today;
                }
                return false;
            }).length;
            
            document.getElementById('totalUsers').textContent = total;
            document.getElementById('onlineUsers').textContent = online;
            document.getElementById('bannedUsers').textContent = banned;
            document.getElementById('todayActive').textContent = todayActive;
        }
        
        function filterUsers() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const rank = document.getElementById('rankFilter').value;
            
            filteredUsers = allUsers.filter(user => {
                if(search && !user.username?.toLowerCase().includes(search)) return false;
                if(status === 'online' && user.status !== 'online') return false;
                if(status === 'offline' && (user.status !== 'offline' || user.banned)) return false;
                if(status === 'banned' && !user.banned) return false;
                if(rank !== 'all' && user.rank != rank) return false;
                return true;
            });
            
            renderUsersTable();
        }
        
        function renderUsersTable() {
            const tbody = document.getElementById('usersTableBody');
            
            if(filteredUsers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:40px;">Tidak ada user</td></tr>';
                return;
            }
            
            let html = '';
            filteredUsers.forEach(user => {
                const statusClass = user.banned ? 'status-banned' : (user.status === 'online' ? 'status-online' : 'status-offline');
                const statusText = user.banned ? '🔴 BANNED' : (user.status === 'online' ? '🟢 Online' : '⚫ Offline');
                
                const rankClass = `rank-${ranks[user.rank || 0].toLowerCase().replace(/[^a-z]/g, '')}`;
                
                let deviceHtml = '-';
                if(user.device) {
                    const d = user.device;
                    deviceHtml = `<div class="device-info">`;
                    if(d.platform) deviceHtml += `📱 ${d.platform}<br>`;
                    if(d.androidVersion) deviceHtml += `📱 Android ${d.androidVersion}<br>`;
                    if(d.ip) deviceHtml += `🌐 ${d.ip}<br>`;
                    if(d.latency) deviceHtml += `⚡ ${d.latency}ms`;
                    deviceHtml += `</div>`;
                }
                
                const lastSeen = user.lastSeen ? new Date(user.lastSeen).toLocaleString('id-ID') : '-';
                
                html += `
                    <tr>
                        <td class="${statusClass}">${statusText}</td>
                        <td><strong>${user.username || 'Unknown'}</strong></td>
                        <td class="${rankClass}">${ranks[user.rank || 0]}</td>
                        <td>💰 ${user.money || 0}</td>
                        <td>💎 ${user.diamond || 0}</td>
                        <td>⭐ ${user.stars || 0}</td>
                        <td>${deviceHtml}</td>
                        <td>${lastSeen}</td>
                        <td>
                            <button class="action-btn btn-edit" onclick="openEditModal('${user.uid}')">✏️</button>
                            ${user.banned ? 
                                `<button class="action-btn btn-unban" onclick="unbanUser('${user.uid}')">🔓</button>` :
                                `<button class="action-btn btn-ban" onclick="openBanModal('${user.uid}', '${user.username}')">🚫</button>`
                            }
                            <button class="action-btn btn-delete" onclick="deleteUser('${user.uid}')">🗑️</button>
                        </td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        }
        
        function refreshData() {
            loadUsers();
            showMessage('Data diperbarui!', 'success');
        }
        
        // ==================== EDIT USER ====================
        function openEditModal(uid) {
            const user = allUsers.find(u => u.uid === uid);
            if(!user) return;
            
            document.getElementById('editUid').value = uid;
            document.getElementById('editUsername').value = user.username || '';
            document.getElementById('editRank').value = user.rank || 0;
            document.getElementById('editMoney').value = user.money || 0;
            document.getElementById('editDiamond').value = user.diamond || 0;
            document.getElementById('editStars').value = user.stars || 0;
            
            document.getElementById('editModal').classList.add('active');
        }
        
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }
        
        async function saveUserEdit() {
            const uid = document.getElementById('editUid').value;
            const data = {
                username: document.getElementById('editUsername').value,
                rank: parseInt(document.getElementById('editRank').value),
                money: parseInt(document.getElementById('editMoney').value) || 0,
                diamond: parseInt(document.getElementById('editDiamond').value) || 0,
                stars: parseInt(document.getElementById('editStars').value) || 0
            };
            
            try {
                await database.ref('users/' + uid).update(data);
                showMessage('User berhasil diupdate!', 'success');
                closeEditModal();
            } catch(e) {
                showMessage('Error: ' + e.message, 'error');
            }
        }
        
        // ==================== BAN USER ====================
        function openBanModal(uid, username) {
            document.getElementById('banUid').value = uid;
            document.getElementById('banUsername').value = username;
            document.getElementById('banReason').value = '';
            document.getElementById('banModal').classList.add('active');
        }
        
        function closeBanModal() {
            document.getElementById('banModal').classList.remove('active');
        }
        
        async function confirmBan() {
            const uid = document.getElementById('banUid').value;
            const reason = document.getElementById('banReason').value;
            
            try {
                await database.ref('users/' + uid).update({
                    banned: true,
                    banReason: reason || 'Tidak ada alasan',
                    bannedAt: firebase.database.ServerValue.TIMESTAMP,
                    bannedBy: currentAdmin
                });
                showMessage('User berhasil di BAN!', 'success');
                closeBanModal();
            } catch(e) {
                showMessage('Error: ' + e.message, 'error');
            }
        }
        
        async function unbanUser(uid) {
            if(!confirm('Yakin ingin membuka ban user ini?')) return;
            
            try {
                await database.ref('users/' + uid).update({
                    banned: false,
                    banReason: null,
                    bannedAt: null,
                    bannedBy: null
                });
                showMessage('User berhasil diunban!', 'success');
            } catch(e) {
                showMessage('Error: ' + e.message, 'error');
            }
        }
        
        async function deleteUser(uid) {
            if(!confirm('⚠️ PERINGATAN! Menghapus user akan menghapus semua data termasuk chat dan friends. Lanjutkan?')) return;
            
            try {
                // Hapus data user
                await database.ref('users/' + uid).remove();
                // Hapus friends
                await database.ref('friends/' + uid).remove();
                // Hapus chat
                await database.ref('private_chats/user_' + uid).remove();
                
                showMessage('User berhasil dihapus!', 'success');
            } catch(e) {
                showMessage('Error: ' + e.message, 'error');
            }
        }
        
        // ==================== KEYBOARD ====================
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape') {
                closeEditModal();
                closeBanModal();
            }
        });
    </script>
</body>
</html>
