<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Developer - FUN GAME</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 255, 136, 0.25);
            backdrop-filter: blur(10px);
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .back-btn {
            background: rgba(0, 255, 136, 0.15);
            border: 2px solid #00ff88;
            color: #00ff88;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        
        .back-btn:hover {
            background: rgba(0, 255, 136, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }
        
        .header-title h1 {
            font-size: 28px;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        
        .header-title p {
            color: #88ffcc;
            font-size: 14px;
        }
        
        .dev-badge {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            padding: 10px 20px;
            border-radius: 30px;
            color: #1a1a2e;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Chat Container */
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(20, 20, 30, 0.7);
            border-radius: 25px;
            border: 1px solid rgba(0, 255, 136, 0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 180px);
        }
        
        /* Chat Header */
        .chat-header {
            padding: 20px 25px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid rgba(0, 255, 136, 0.2);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .dev-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #1a1a2e;
            border: 2px solid #00ff88;
        }
        
        .dev-info h3 {
            color: #00ff88;
            font-size: 18px;
        }
        
        .dev-info p {
            color: #88ffcc;
            font-size: 13px;
        }
        
        .encryption-badge {
            margin-left: auto;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid #ffd700;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        /* Chat Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 136, 0.3);
            border-radius: 4px;
        }
        
        /* Message Bubbles - Style WhatsApp */
        .message {
            display: flex;
            margin-bottom: 5px;
            animation: fadeIn 0.3s ease;
        }
        
        .message.user-message {
            justify-content: flex-end;
        }
        
        .message.dev-message {
            justify-content: flex-start;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 15px;
        }
        
        .user-message .message-bubble {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #1a1a2e;
            border-bottom-right-radius: 4px;
        }
        
        .dev-message .message-bubble {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
        
        .message-time {
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.7;
            text-align: right;
        }
        
        .user-message .message-time {
            color: #1a1a2e;
        }
        
        .dev-message .message-time {
            color: #88ffcc;
        }
        
        /* System Message (Blocked Words) */
        .system-message {
            text-align: center;
            margin: 10px 0;
        }
        
        .system-bubble {
            background: rgba(255, 68, 68, 0.15);
            color: #ff8888;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            border: 1px solid #ff4444;
        }
        
        /* Chat Input */
        .chat-input-container {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 2px solid rgba(0, 255, 136, 0.2);
        }
        
        .chat-form {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        
        .chat-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 25px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
            resize: none;
            min-height: 60px;
            max-height: 150px;
            line-height: 1.5;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: #00ff88;
            background: rgba(255, 255, 255, 0.12);
        }
        
        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .char-counter {
            position: absolute;
            bottom: 8px;
            right: 15px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 6px;
            border-radius: 10px;
        }
        
        .send-btn {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border: none;
            border-radius: 25px;
            padding: 0 30px;
            height: 60px;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.2);
        }
        
        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.4);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Warning Info */
        .warning-info {
            max-width: 800px;
            margin: 20px auto 0;
            padding: 15px;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            border-radius: 15px;
            font-size: 13px;
            color: #ff8888;
            text-align: center;
        }
        
        .warning-info span {
            color: #ffaa00;
            font-weight: bold;
        }
        
        /* Message */
        .message-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            min-width: 300px;
            text-align: center;
        }
        
        .message-popup.success {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
        }
        
        .message-popup.error {
            background: linear-gradient(135deg, #ff3333, #cc0000);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #00ff88;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 10px; }
            
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            
            .header-left {
                width: 100%;
                justify-content: space-between;
            }
            
            .dev-badge {
                width: 100%;
                justify-content: center;
            }
            
            .chat-container {
                height: calc(100vh - 250px);
            }
            
            .message-bubble {
                max-width: 85%;
            }
            
            .send-btn {
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <a href="lobby.html" class="back-btn" onclick="playClickSound()">←</a>
            <div class="header-title">
                <h1>💬 CONTACT DEV</h1>
                <p>Chat langsung dengan developer</p>
            </div>
        </div>
        <div class="dev-badge">
            <span>👨‍💻</span> Taher (Developer)
        </div>
    </div>
    
    <!-- Chat Container -->
    <div class="chat-container">
        <!-- Chat Header -->
        <div class="chat-header">
            <div class="dev-avatar">T</div>
            <div class="dev-info">
                <h3>Taher - Developer</h3>
                <p>Online</p>
            </div>
            <div class="encryption-badge">
                <span>🔒</span> End-to-End
            </div>
        </div>
        
        <!-- Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="loading">Memuat percakapan...</div>
        </div>
        
        <!-- Input Area -->
        <div class="chat-input-container">
            <form class="chat-form" id="chatForm" onsubmit="sendMessage(event)">
                <div class="input-wrapper">
                    <textarea 
                        class="chat-input" 
                        id="messageInput" 
                        placeholder="Ketik pesan..." 
                        maxlength="500"
                        oninput="updateCharCounter()"
                        onkeydown="handleEnter(event)"
                        rows="1"
                    ></textarea>
                    <div class="char-counter" id="charCounter">0/500</div>
                </div>
                <button type="submit" class="send-btn" id="sendBtn">
                    <span>📤</span> Kirim
                </button>
            </form>
        </div>
    </div>
    
    <!-- Warning Info -->
    <div class="warning-info" id="warningInfo">
        <span>⚠️ PERHATIAN:</span> Dilarang menggunakan kata-kata kasar.
    </div>
    
    <!-- Audio -->
    <audio id="clickSound" preload="auto">
        <source src="https://c.top4top.io/m_3673bf8xd0.mp3" type="audio/mpeg">
    </audio>
    <audio id="messageSound" preload="auto">
        <source src="https://f.top4top.io/m_36745wqti1.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        // ==================== AUDIO ====================
        let clickVolume = 0.7;
        
        function playClickSound() {
            const clickSound = document.getElementById('clickSound');
            if (clickSound) {
                clickSound.volume = clickVolume;
                clickSound.currentTime = 0;
                clickSound.play().catch(e => console.log("Click sound error:", e));
            }
        }
        
        function playMessageSound() {
            const messageSound = document.getElementById('messageSound');
            if (messageSound) {
                messageSound.volume = 0.5;
                messageSound.currentTime = 0;
                messageSound.play().catch(e => console.log("Message sound error:", e));
            }
        }
        
        // Load saved volume
        const savedClickVol = localStorage.getItem('clickVolume');
        if (savedClickVol) {
            clickVolume = parseFloat(savedClickVol);
        }
        
        // ==================== FIREBASE ====================
        let currentUser = null;
        let chatListener = null;
        const DEV_UID = "taher_dev_2024"; // UID khusus untuk developer
        const MAX_MESSAGE_LENGTH = 500;
        
        // Daftar kata terlarang (case insensitive)
        const blockedWords = [
            'tuti', 'adam', 'dam', 'haer', 'tut', 'nisa', 'usman'
        ];
        
        // ==================== ENKRIPSI SEDERHANA ====================
        function encryptMessage(text) {
            // Enkripsi sederhana: Caesar cipher + reverse
            let encrypted = '';
            for (let i = 0; i < text.length; i++) {
                let charCode = text.charCodeAt(i);
                // Geser 5 karakter
                encrypted += String.fromCharCode(charCode + 5);
            }
            // Balik string
            return encrypted.split('').reverse().join('');
        }
        
        function decryptMessage(encryptedText) {
            try {
                // Balik string dulu
                const reversed = encryptedText.split('').reverse().join('');
                let decrypted = '';
                for (let i = 0; i < reversed.length; i++) {
                    let charCode = reversed.charCodeAt(i);
                    // Kembalikan geseran 5 karakter
                    decrypted += String.fromCharCode(charCode - 5);
                }
                return decrypted;
            } catch (e) {
                console.error("Decrypt error:", e);
                return "[Pesan tidak dapat didekripsi]";
            }
        }
        
        // ==================== CEK KATA TERLARANG ====================
        function containsBlockedWords(text) {
            const lowerText = text.toLowerCase();
            for (let word of blockedWords) {
                if (lowerText.includes(word.toLowerCase())) {
                    return word;
                }
            }
            return false;
        }
        
        // ==================== MESSAGE FUNCTIONS ====================
        function showMessage(text, type = 'success') {
            const message = document.createElement('div');
            message.className = `message-popup ${type}`;
            message.textContent = text;
            document.body.appendChild(message);
            
            setTimeout(() => {
                message.remove();
            }, 3000);
        }
        
        function updateCharCounter() {
            const input = document.getElementById('messageInput');
            const counter = document.getElementById('charCounter');
            const length = input.value.length;
            counter.textContent = `${length}/${MAX_MESSAGE_LENGTH}`;
            
            if (length >= MAX_MESSAGE_LENGTH) {
                counter.style.color = '#ff4444';
            } else {
                counter.style.color = 'rgba(255, 255, 255, 0.4)';
            }
        }
        
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'baru saja';
            if (diff < 3600000) {
                const minutes = Math.floor(diff / 60000);
                return `${minutes} menit yang lalu`;
            }
            return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }
        
        // ==================== LOAD MESSAGES ====================
        function loadMessages() {
            if (!currentUser) return;
            
            const chatId = currentUser.uid === DEV_UID ? 'dev_chat' : `user_${currentUser.uid}`;
            const messagesRef = database.ref(`private_chats/${chatId}/messages`);
            
            if (chatListener) {
                chatListener.off();
            }
            
            chatListener = messagesRef
                .orderByChild('timestamp')
                .limitToLast(50)
                .on('value', (snapshot) => {
                    const messages = snapshot.val();
                    const messagesDiv = document.getElementById('chatMessages');
                    
                    if (!messages) {
                        messagesDiv.innerHTML = `
                            <div style="text-align: center; padding: 40px; color: #88ffcc;">
                                💬 Belum ada pesan. Kirim pesan pertama ke developer!
                            </div>
                        `;
                        return;
                    }
                    
                    let html = '';
                    const messageArray = [];
                    
                    snapshot.forEach(childSnapshot => {
                        messageArray.push({
                            id: childSnapshot.key,
                            ...childSnapshot.val()
                        });
                    });
                    
                    messageArray.sort((a, b) => a.timestamp - b.timestamp);
                    
                    messageArray.forEach(msg => {
                        const isFromUser = msg.sender === currentUser.uid;
                        const timeStr = formatTime(msg.timestamp);
                        
                        // Decrypt message
                        let messageText = msg.encrypted ? decryptMessage(msg.text) : msg.text;
                        
                        html += `
                            <div class="message ${isFromUser ? 'user-message' : 'dev-message'}">
                                <div class="message-bubble">
                                    ${escapeHtml(messageText)}
                                    <div class="message-time">${timeStr}</div>
                                </div>
                            </div>
                        `;
                    });
                    
                    messagesDiv.innerHTML = html;
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    
                    // Play sound untuk pesan baru (kecuali pesan sendiri)
                    const lastMsg = messageArray[messageArray.length - 1];
                    if (lastMsg && lastMsg.sender !== currentUser.uid) {
                        playMessageSound();
                    }
                });
        }
        
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        
        // ==================== SEND MESSAGE ====================
        async function sendMessage(event) {
            event.preventDefault();
            playClickSound();
            
            if (!currentUser) {
                showMessage('Silahkan login terlebih dahulu!', 'error');
                return;
            }
            
            const input = document.getElementById('messageInput');
            let message = input.value.trim();
            
            if (!message) {
                showMessage('Pesan tidak boleh kosong!', 'error');
                return;
            }
            
            if (message.length > MAX_MESSAGE_LENGTH) {
                showMessage(`Pesan maksimal ${MAX_MESSAGE_LENGTH} karakter!`, 'error');
                return;
            }
            
            // Cek kata terlarang
            const blockedWord = containsBlockedWords(message);
            if (blockedWord) {
                showMessage(`Pesan mengandung kata terlarang: "${blockedWord}"`, 'error');
                
                // Tampilkan pesan sistem di chat
                const messagesDiv = document.getElementById('chatMessages');
                const systemMsg = document.createElement('div');
                systemMsg.className = 'system-message';
                systemMsg.innerHTML = `<div class="system-bubble">⚠️ Pesan diblokir: mengandung kata terlarang</div>`;
                messagesDiv.appendChild(systemMsg);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                
                input.value = '';
                updateCharCounter();
                return;
            }
            
            // Disable button
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            try {
                const chatId = `user_${currentUser.uid}`;
                const encryptedMessage = encryptMessage(message);
                
                // Simpan ke Firebase
                await database.ref(`private_chats/${chatId}/messages`).push({
                    sender: currentUser.uid,
                    senderName: currentUser.username,
                    text: encryptedMessage,
                    encrypted: true,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                
                // Update last message info
                await database.ref(`private_chats/${chatId}/info`).set({
                    lastMessage: encryptedMessage.substring(0, 30) + '...',
                    lastTimestamp: firebase.database.ServerValue.TIMESTAMP,
                    fromUser: currentUser.username,
                    userUid: currentUser.uid,
                    unread: true
                });
                
                input.value = '';
                updateCharCounter();
                
                setTimeout(() => {
                    sendBtn.disabled = false;
                }, 1000);
                
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
                sendBtn.disabled = false;
            }
        }
        
        // ==================== HANDLE ENTER ====================
        function handleEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage(event);
            }
        }
        
        // ==================== INITIALIZE ====================
        async function initChat() {
            const savedUser = localStorage.getItem('currentUser');
            if (!savedUser) {
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const user = JSON.parse(savedUser);
                
                const snapshot = await database.ref('users/' + user.uid).once('value');
                const userData = snapshot.val();
                
                if (!userData || userData.banned) {
                    localStorage.removeItem('currentUser');
                    window.location.href = 'login.html';
                    return;
                }
                
                currentUser = {
                    uid: user.uid,
                    username: userData.username,
                    rank: userData.rank || 0
                };
                
                // Update judul
                document.querySelector('.header-title p').textContent = 
                    `Chat dengan developer (${currentUser.username})`;
                
                // Load messages
                loadMessages();
                
                // Update char counter
                updateCharCounter();
                
                // Add click sound
                document.querySelectorAll('button, .back-btn').forEach(btn => {
                    btn.addEventListener('click', playClickSound);
                });
                
                // Auto-resize textarea
                const textarea = document.getElementById('messageInput');
                textarea.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = (this.scrollHeight) + 'px';
                    if (this.scrollHeight > 150) {
                        this.style.height = '150px';
                    }
                });
                
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
                console.error('Error initializing chat:', error);
            }
        }
        
        // ==================== EVENT LISTENERS ====================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.location.href = 'lobby.html';
            }
        });
        
        window.onload = initChat;
    </script>
</body>
</html>
