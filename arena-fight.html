        // Efek partikel

        // ==================== INISIALISASI SCENE ====================
        function init() {
            console.log("Initializing scene...");
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Langit biru
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 15);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            console.log("Renderer created");
            
            // Pencahayaan
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Ground HIJAU
            const groundGeometry = new THREE.PlaneGeometry(40, 40);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff00 }); // Hijau
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Grid
            const gridHelper = new THREE.GridHelper(40, 20, 0x000000, 0x333333);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);
            
            // Buat karakter
            createCharacters();
            
            // Setup joystick
            setupJoystick();
            
            // Event listeners
            window.addEventListener('resize', onWindowResize);
            
            // Update UI
            updateHPBars();
            updateCooldownDisplay();
            
            // Start animation
            animate();
            console.log("Animation started");
        }
        
        function createCharacters() {
            // Material
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xF5D0A9 });
            const blueMat = new THREE.MeshLambertMaterial({ color: 0x4a90e2 });
            const greenMat = new THREE.MeshLambertMaterial({ color: 0x2ecc71 });
            const purpleMat = new THREE.MeshLambertMaterial({ color: 0x8e44ad });
            const blackMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
            const redMat = new THREE.MeshLambertMaterial({ color: 0xff3333 });
            
            // ===== PLAYER (BIRU) =====
            player = new THREE.Group();
            
            // Kepala
            const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32), skinMat);
            pHead.position.set(0, 4.8, 0);
            pHead.castShadow = true;
            player.add(pHead);
            
            // Leher
            const pNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1, 8), skinMat);
            pNeck.position.set(0, 4.5, 0);
            pNeck.castShadow = true;
            player.add(pNeck);
            
            // Badan
            const pTorso = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.5, 1.8, 8), blueMat);
            pTorso.position.set(0, 3.2, 0);
            pTorso.castShadow = true;
            player.add(pTorso);
            
            // Lengan kiri
            const pLeftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5, 8), blueMat);
            pLeftArm.position.set(-0.8, 3.2, 0);
            pLeftArm.rotation.z = 0.2;
            pLeftArm.castShadow = true;
            player.add(pLeftArm);
            
            // Lengan kanan
            const pRightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5, 8), blueMat);
            pRightArm.position.set(0.8, 3.2, 0);
            pRightArm.rotation.z = -0.2;
            pRightArm.castShadow = true;

            // Kaki kiri
            const pLeftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.17, 2.9, 8), greenMat);
            pLeftLeg.position.set(-0.3, 1.0, 0);
            pLeftLeg.castShadow = true;
            pLeftLeg.userData = { type: 'leftLeg' };
            player.add(pLeftLeg);
            playerLegs.left = pLeftLeg;
            
            // Kaki kanan
            const pRightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.17, 2.9, 8), greenMat);
            pRightLeg.position.set(0.3, 1.0, 0);
            pRightLeg.castShadow = true;
            pRightLeg.userData = { type: 'rightLeg' };
            player.add(pRightLeg);
            playerLegs.right = pRightLeg;
            
            // ===== ENEMY (UNGU + TANDUK) =====
            enemy = new THREE.Group();
            
            // Kepala
            const eHead = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32), skinMat);
            eHead.position.set(0, 4.8, 0);
            eHead.castShadow = true;
            enemy.add(eHead);
            
            // Leher
            const eNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1, 8), skinMat);
            eNeck.position.set(0, 4.5, 0);
            eNeck.castShadow = true;
            enemy.add(eNeck);
            
            // Badan
            const eTorso = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.5, 1.8, 8), purpleMat);
            eTorso.position.set(0, 3.2, 0);
            eTorso.castShadow = true;
            enemy.add(eTorso);
            
            // Lengan kiri
            const eLeftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5, 8), purpleMat);
            eLeftArm.position.set(-0.8, 3.2, 0);
            eLeftArm.rotation.z = 0.2;
            eLeftArm.castShadow = true;
            enemy.add(eLeftArm);
            
            // Lengan kanan
            const eRightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5, 8), purpleMat);
            eRightArm.position.set(0.8, 3.2, 0);
            eRightArm.rotation.z = -0.2;
            eRightArm.castShadow = true;
            enemy.add(eRightArm);
            
            // Kaki kiri
            const eLeftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.17, 2.9, 8), blackMat);
            eLeftLeg.position.set(-0.3, 1.0, 0);
            eLeftLeg.castShadow = true;
            eLeftLeg.userData = { type: 'leftLeg' };
            enemy.add(eLeftLeg);
            enemyLegs.left = eLeftLeg;
            
            // Kaki kanan
            const eRightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.17, 2.9, 8), blackMat);
            eRightLeg.position.set(0.3, 1.0, 0);
            eRightLeg.castShadow = true;
            eRightLeg.userData = { type: 'rightLeg' };
            enemy.add(eRightLeg);
            enemyLegs.right = eRightLeg;
            
            // Tanduk merah
            const horn1 = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.8, 8), redMat);
            horn1.position.set(-0.25, 5.2, 0.2);
            horn1.rotation.x = 0.3;
            horn1.rotation.z = -0.2;
            horn1.castShadow = true;
            enemy.add(horn1);
            
            const horn2 = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.8, 8), redMat);
            horn2.position.set(0.25, 5.2, 0.2);
            horn2.rotation.x = 0.3;

            // Posisi
            player.position.set(-5, 1, 0);

            enemy.rotation.y = Math.PI;
            
            scene.add(player);
            scene.add(enemy);
        }
        
        // ==================== JOYSTICK ====================
        function setupJoystick() {
            joystick.addEventListener('mousedown', onJoystickStart);
            joystick.addEventListener('touchstart', onJoystickStart);
            document.addEventListener('mousemove', onJoystickMove);
            document.addEventListener('touchmove', onJoystickMove);
            document.addEventListener('mouseup', onJoystickEnd);
            document.addEventListener('touchend', onJoystickEnd);
        }
        
        function onJoystickStart(e) {
            e.preventDefault();
            isJoystickActive = true;
        }
        
        function onJoystickMove(e) {
            if (!isJoystickActive) return;
            e.preventDefault();
            
            const rect = joystick.getBoundingClientRect();
            const centerX = rect.left + rect.width/2;
            const centerY = rect.top + rect.height/2;
            
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            const deltaX = clientX - centerX;
            const deltaY = clientY - centerY;
            const distance = Math.min(Math.sqrt(deltaX*deltaX + deltaY*deltaY), 35);
            const angle = Math.atan2(deltaY, deltaX);
            
            const handleX = 30 + distance * Math.cos(angle);
            const handleY = 30 + distance * Math.sin(angle);
            joystickHandle.style.left = handleX + 'px';
            joystickHandle.style.top = handleY + 'px';
            
            const normX = deltaX / 35;
            const normY = deltaY / 35;
            playerVelocity.x = normX * playerSpeed;
            playerVelocity.z = normY * playerSpeed;
            
            if (playerVelocity.length() > 0.01) {
                player.rotation.y = Math.atan2(playerVelocity.x, playerVelocity.z);
                isPlayerWalking = true;
            } else {
                isPlayerWalking = false;
            }
        }
        
        function onJoystickEnd() {
            isJoystickActive = false;
            joystickHandle.style.left = '30px';
            joystickHandle.style.top = '30px';
            playerVelocity.set(0,0,0);
            isPlayerWalking = false;
        }
        
        // ==================== ANIMASI JALAN ====================
        function updateWalkingAnimation(delta) {
            if (isPlayerWalking && playerStun <= 0) {
                walkCycle += delta * 8;
                if (playerLegs.left) playerLegs.left.rotation.x = Math.sin(walkCycle) * 0.3;
                if (playerLegs.right) playerLegs.right.rotation.x = -Math.sin(walkCycle) * 0.3;
            } else {
                if (playerLegs.left) playerLegs.left.rotation.x = 0;
                if (playerLegs.right) playerLegs.right.rotation.x = 0;
            }
            
            // Enemy AI walk
            if (enemyStun <= 0 && enemyHP > 0 && playerHP > 0) {
                let dir = new THREE.Vector3().subVectors(player.position, enemy.position);
                let dist = dir.length();
                if (dist > ATTACK_RANGE) {
                    dir.y = 0;
                    dir.normalize();
                    enemy.position.x += dir.x * 0.08;
                    enemy.position.z += dir.z * 0.08;
                    enemy.rotation.y = Math.atan2(dir.x, dir.z);
                    
                    if (enemyLegs.left) enemyLegs.left.rotation.x = Math.sin(walkCycle) * 0.3;
                    if (enemyLegs.right) enemyLegs.right.rotation.x = -Math.sin(walkCycle) * 0.3;
                }
            }
        }
        
        // ==================== SKILL PLAYER ====================
        function useSkill(skill) {
            if (playerStun > 0) {
                showStatusMessage("TerStun!", 1);
                return;
            }
            
            if (skill === 1 && skill1CD <= 0) {
                // Skill Petir
                skill1CD = SKILL1_COOLDOWN;
                playerCCImmune = 2;
                
                // Damage
                enemyHP = Math.max(0, enemyHP - 500);
                updateHPBars();
                
                // Efek
                createLightningEffect(enemy.position.clone());
                createDustExplosion(enemy.position.clone());
                showStatusMessage("PETIR! -500", 1);
                
            } else if (skill === 2 && skill2CD <= 0) {
                // Skill Teleport
                skill2CD = SKILL2_COOLDOWN;
                
                let originalPos = player.position.clone();
                let dir = new THREE.Vector3().subVectors(enemy.position, player.position).normalize();
                let behindPos = enemy.position.clone().add(dir.multiplyScalar(2));
                behindPos.y = originalPos.y;
                
                // Teleport
                player.position.copy(behindPos);
                
                // Damage dan stun
                enemyHP = Math.max(0, enemyHP - 500);
                enemyStun = 5;
                updateHPBars();
                showDebuffText(enemy, "STUN 5s", 5);
                
                // Kembali
                setTimeout(() => {
                    if (playerHP > 0 && enemyHP > 0) {
                        player.position.copy(originalPos);
                    }
                }, 500);
                
                showStatusMessage("TELEPORT! -500", 1);
                
            } else if (skill === 3 && skill3CD <= 0) {
                // Skill Duri
                skill3CD = SKILL3_COOLDOWN;
                
                // Lingkaran area
                createCircleArea(enemy.position.clone(), 3);
                
                // 3 duri berturut-turut
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        if (enemyHP <= 0) return;
                        
                        createSpike(enemy.position.clone());
                        
                        if (i === 0) {
                            enemyHP = Math.max(0, enemyHP - 500);
                            enemyStun = 5;
                            updateHPBars();
                            showDebuffText(enemy, "STUN 5s", 5);
                            createDustExplosion(enemy.position.clone(), 10);
                        } else {
                            createDustExplosion(enemy.position.clone(), 5);
                        }
                    }, i * 400);
                }
                showStatusMessage("DURI! 3x tusukan", 1);
            }
            
            updateCooldownDisplay();
            checkDeath();
        }
        
        // ==================== SKILL MUSUH ====================
        function enemyUseSkill() {
            if (enemyStun > 0 || enemyHP <= 0 || playerHP <= 0) return;
            
            let skill = Math.floor(Math.random() * 2);
            if (skill === 0) {
                showStatusMessage("MUSUH: FIRE BLAST!", 2);
                createFireEffect(player.position);
                playerHP = Math.max(0, playerHP - 400);
                updateHPBars();
                showDebuffText(player, "TERBAKAR", 2);
            } else {
                showStatusMessage("MUSUH: LEAP SMASH!", 2);
                enemy.position.y += 2;
                setTimeout(() => enemy.position.y -= 2, 200);
                createDustExplosion(player.position);
                playerHP = Math.max(0, playerHP - 350);
                updateHPBars();
                playerStun = 1;
                showDebuffText(player, "STUN 1s", 1);
            }
            checkDeath();
        }
        
        // ==================== BASIC ATTACK ====================
        function basicAttack(attacker, target, isPlayerAttacker) {
            if (attacker === player && playerStun > 0) return false;
            if (attacker === enemy && enemyStun > 0) return false;
            
            let dist = attacker.position.distanceTo(target.position);
            if (dist > ATTACK_RANGE) return false;
            
            if (isPlayerAttacker) {
                enemyHP = Math.max(0, enemyHP - 200);
                showDebuffText(enemy, "-200", 0.3);
            } else {
                playerHP = Math.max(0, playerHP - 200);
                showDebuffText(player, "-200", 0.3);
            }
            updateHPBars();
            checkDeath();
            return true;
        }
        
        // ==================== EFEK VISUAL ====================
        function createLightningEffect(pos) {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const points = [];
                    points.push(new THREE.Vector3(pos.x + (Math.random()-0.5)*5, 10, pos.z + (Math.random()-0.5)*5));
                    points.push(new THREE.Vector3(pos.x + (Math.random()-0.5)*2, 5, pos.z + (Math.random()-0.5)*2));
                    points.push(new THREE.Vector3(pos.x, 1, pos.z));
                    
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const material = new THREE.LineBasicMaterial({ color: 0xffdd00 });
                    const line = new THREE.Line(geometry, material);
                    scene.add(line);
                    setTimeout(() => scene.remove(line), 150);
                }, i * 50);
            }
        }
        
        function createSpike(pos) {
            const spikeGeo = new THREE.ConeGeometry(0.8, 2.5, 8);
            const spikeMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const spike = new THREE.Mesh(spikeGeo, spikeMat);
            spike.position.set(pos.x, pos.y + 1.2, pos.z);
            spike.castShadow = true;
            scene.add(spike);
            
            setTimeout(() => scene.remove(spike), 1000);
        }
        
        function createCircleArea(pos, radius) {
            const points = [];
            for (let i = 0; i <= 32; i++) {
                let angle = (i/32) * Math.PI * 2;
                points.push(new THREE.Vector3(pos.x + Math.cos(angle)*radius, pos.y+0.1, pos.z + Math.sin(angle)*radius));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0xffaa00 });
            const circle = new THREE.LineLoop(geometry, material);
            scene.add(circle);
            setTimeout(() => scene.remove(circle), 800);
        }
        
        function createDustExplosion(pos, count = 15) {
            for (let i = 0; i < count; i++) {
                const particle = new THREE.Mesh(
                    new THREE.SphereGeometry(0.1 + Math.random()*0.2, 3),
                    new THREE.MeshStandardMaterial({ color: 0x8B5A2B })
                );
                particle.position.set(pos.x + (Math.random()-0.5)*3, pos.y, pos.z + (Math.random()-0.5)*3);
                particle.velocity = new THREE.Vector3((Math.random()-0.5)*0.2, Math.random()*0.3, (Math.random()-0.5)*0.2);
                particle.life = 1.0;
                scene.add(particle);
                particles.push(particle);
            }
        }
        
        function createFireEffect(pos) {
            for (let i = 0; i < 15; i++) {
                const particle = new THREE.Mesh(
                    new THREE.SphereGeometry(0.15, 3),
                    new THREE.MeshStandardMaterial({ color: 0xff5500 })
                );
                particle.position.set(pos.x + (Math.random()-0.5)*5, pos.y, pos.z + (Math.random()-0.5)*5);
                particle.velocity = new THREE.Vector3((Math.random()-0.5)*0.15, 0.2, (Math.random()-0.5)*0.15);
                particle.life = 1.0;
                scene.add(particle);
                particles.push(particle);
            }
        }
        
        function updateParticles(delta) {
            for (let i = particles.length-1; i >= 0; i--) {
                let p = particles[i];
                p.life -= delta;
                if (p.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                } else {
                    p.position.add(p.velocity);
                    p.material.opacity = p.life;
                    p.material.transparent = true;
                }
            }
        }
        
        // ==================== UI ====================
        function updateHPBars() {
            document.getElementById('player-hp-value').innerText = playerHP;
            document.getElementById('enemy-hp-value').innerText = enemyHP;
            document.getElementById('player-hp-fill').style.width = (playerHP/playerMaxHP*100)+'%';
            document.getElementById('enemy-hp-fill').style.width = (enemyHP/enemyMaxHP*100)+'%';
        }
        
        function updateCooldownDisplay() {
            document.getElementById('cd1').innerText = Math.ceil(skill1CD);
            document.getElementById('cd2').innerText = Math.ceil(skill2CD);
            document.getElementById('cd3').innerText = Math.ceil(skill3CD);
            document.getElementById('skill1').classList.toggle('disabled', skill1CD > 0);
            document.getElementById('skill2').classList.toggle('disabled', skill2CD > 0);
            document.getElementById('skill3').classList.toggle('disabled', skill3CD > 0);
        }
        
        function showStatusMessage(msg, duration) {
            let el = document.getElementById('status-message');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', duration*1000);
        }
        
        function showDebuffText(target, text, duration) {
            let div = document.createElement('div');
            div.className = 'debuff-text';
            div.innerText = text;
            document.body.appendChild(div);
            
            let updatePos = () => {
                let vector = target.position.clone().add(new THREE.Vector3(0, 6, 0));
                vector.project(camera);
                let x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                let y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                div.style.left = x + 'px';
                div.style.top = y + 'px';
            };
            updatePos();
            
            let interval = setInterval(updatePos, 50);
            setTimeout(() => {
                clearInterval(interval);
                div.remove();
            }, duration*1000);
        }
        
        // ==================== GAME LOGIC ====================
        function checkDeath() {
            if (playerHP <= 0) {
                playerHP = 0;
                updateHPBars();
                endGame(false);
            } else if (enemyHP <= 0) {
                enemyHP = 0;
                updateHPBars();
                endGame(true);
            }
        }
        
        function endGame(playerWin) {
            playerVelocity.set(0,0,0);
            isJoystickActive = false;
            
            let resultText = playerWin ? "VICTORY! +2500💰" : "DEFEAT...";
            document.getElementById('result-text').innerText = resultText;
            document.getElementById('result-screen').style.display = 'flex';
            
            if (playerWin) {
                playerMoney += 2500;
                playerStars += 1;
                if (playerStars >= 5) {
                    playerStars = 0;
                    playerRank = Math.min(12, playerRank + 1);
                }
                
                // Update localStorage
                if (currentUser) {
                    currentUser.money = playerMoney;
                    currentUser.rank = playerRank;
                    currentUser.stars = playerStars;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                }
            } else {
                if (playerStars > 0) playerStars--;
                else if (playerRank > 0) {
                    playerRank--;
                    playerStars = 4;
                }
                
                if (currentUser) {
                    currentUser.rank = playerRank;
                    currentUser.stars = playerStars;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                }
            }
        }
        
        function backToLobby() {
            window.location.href = 'lobby.html';
        }
        
        // ==================== UPDATE LOOP ====================
        function animate() {
            requestAnimationFrame(animate);
            
            let delta = Math.min(clock.getDelta(), 0.1);
            
            // Update cooldown
            if (skill1CD > 0) skill1CD = Math.max(0, skill1CD - delta);
            if (skill2CD > 0) skill2CD = Math.max(0, skill2CD - delta);
            if (skill3CD > 0) skill3CD = Math.max(0, skill3CD - delta);
            if (playerStun > 0) playerStun = Math.max(0, playerStun - delta);
            if (enemyStun > 0) enemyStun = Math.max(0, enemyStun - delta);
            if (playerCCImmune > 0) playerCCImmune = Math.max(0, playerCCImmune - delta);
            
            if (playerAttackTimer > 0) playerAttackTimer -= delta;
            if (enemyAttackTimer > 0) enemyAttackTimer -= delta;
            
            // Gerak player
            if (playerStun <= 0 && playerHP > 0) {
                player.position.x += playerVelocity.x;
                player.position.z += playerVelocity.z;
                player.position.x = Math.max(-15, Math.min(15, player.position.x));
                player.position.z = Math.max(-15, Math.min(15, player.position.z));
            }
            
            // Enemy AI skill
            if (enemyHP > 0 && playerHP > 0 && Math.random() < 0.005) {
                enemyUseSkill();
            }
            
            // Enemy basic attack
            if (enemyAttackTimer <= 0 && enemyStun <= 0 && enemyHP > 0 && playerHP > 0) {
                if (enemy.position.distanceTo(player.position) <= ATTACK_RANGE) {
                    if (basicAttack(enemy, player, false)) {
                        enemyAttackTimer = ATTACK_COOLDOWN;
                    }
                }
            }
            
            // Player basic attack
            if (playerAttackTimer <= 0 && playerStun <= 0 && playerHP > 0 && enemyHP > 0) {
                if (player.position.distanceTo(enemy.position) <= ATTACK_RANGE) {
                    if (basicAttack(player, enemy, true)) {
                        playerAttackTimer = ATTACK_COOLDOWN;
                    }
                }
            }
            
            updateWalkingAnimation(delta);
            updateParticles(delta);
            
            // Kamera
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 10;
            camera.position.y = 6;
            camera.lookAt(player.position.x, player.position.y + 2, player.position.z);
            
            updateCooldownDisplay();
            
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Mulai game
        window.onload = init;
    </script>
</body>
</html>
